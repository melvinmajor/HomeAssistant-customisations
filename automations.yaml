      today) %}\n{% set residual = strptime(states('sensor.residual_household_waste'),
      '%d/%m/%Y', today) %}\n\n{{\n  paper.date() - timedelta(days=1) == today\n  or
      pmd.date() - timedelta(days=1) == today\n  or residual.date() - timedelta(days=1)
