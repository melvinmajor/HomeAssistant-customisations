- id: '1759051652362'
  alias: FanSHIM ventilation
  description: Control FanSHIM fan with hysteresis based on CPU temperature
  triggers:
  - entity_id: sensor.system_monitor_temperature_cpu
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.system_monitor_temperature_cpu
        above: 80
      sequence:
      - target:
          entity_id: switch.fanshim_fan
        action: switch.turn_on
        data: {}
    - conditions:
      - condition: numeric_state
        entity_id: sensor.system_monitor_temperature_cpu
        below: 60
      sequence:
      - target:
          entity_id: switch.fanshim_fan
        action: switch.turn_off
  mode: single
