- id: '1726612228090'
  alias: Entrance light motion at night
  description: Night motion automation (guests / no guests unified)
  triggers:
  - trigger: state
    entity_id: binary_sensor.detecteur_entree_mouvement
    to: 'on'
    id: chambre
  - trigger: state
    entity_id: binary_sensor.hue_motion_sensor_2_mouvement
    to: 'on'
    id: bureau
  conditions:
  - condition: time
    after: '23:00:00'
    before: sensor.sun_next_dawn
  - condition: state
    entity_id: input_boolean.entrance_light_override
    state: 'off'
  - condition: state
    entity_id: input_boolean.cat_night_override
    state: 'off'
  - condition: state
    entity_id: input_boolean.home
    state:
    - 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: chambre
      sequence:
      - if:
        - condition: and
          conditions:
          - condition: state
            entity_id: input_boolean.visitor_override
            state: 'off'
          - condition: numeric_state
            entity_id: sensor.myggspray_wrlss_mtn_sensor_illuminance
            above: 8
        then:
        - stop: Someone in bathroom, no need of light.
        else:
        - action: light.turn_on
          target:
            entity_id:
            - light.couloir_cote_chambre
          data:
            brightness_pct: 20
    - conditions:
      - condition: trigger
        id: bureau
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.couloir_cote_bureau
        data:
          brightness_pct: 20
  - wait_template: "{{\n  is_state('binary_sensor.detecteur_entree_mouvement', 'off')\n
      \ and\n  is_state('binary_sensor.hue_motion_sensor_2_mouvement', 'off')\n}}\n"
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.visitor_override
        state: 'on'
      sequence:
      - delay: 00:00:30
    default:
    - delay: 00:00:10
  - condition: template
    value_template: "{{\n  is_state('binary_sensor.detecteur_entree_mouvement', 'off')\n
      \ and\n  is_state('binary_sensor.hue_motion_sensor_2_mouvement', 'off')\n}}\n"
  - action: light.turn_off
    target:
      entity_id:
      - light.accueil
    data: {}
  mode: restart
- id: '1726612427289'
  alias: Entrance light motion at day - bed side
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.detecteur_entree_mouvement
    to: 'on'
    trigger: state
  conditions:
  - condition: time
    after: sensor.sun_next_rising
    before: sensor.sun_next_setting
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.detecteur_entree_eclairement
      below: 6
    - condition: state
      entity_id: light.couloir_cote_chambre
      state:
      - 'on'
  - condition: state
    entity_id: input_boolean.entrance_light_override
    state: 'off'
  - condition: state
    entity_id: input_boolean.cat_night_override
    state: 'off'
  - condition: state
    entity_id: input_boolean.home
    state:
    - 'on'
  actions:
  - if:
    - condition: state
      entity_id: light.couloir_cote_chambre
      state: 'off'
    then:
    - target:
        entity_id: light.couloir_cote_chambre
      data:
        brightness_pct: 100
      action: light.turn_on
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.detecteur_entree_mouvement
      to: 'off'
      trigger: state
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - condition: state
    entity_id: binary_sensor.detecteur_entree_mouvement
    state: 'off'
  - target:
      entity_id: light.couloir_cote_chambre
    action: light.turn_off
    data: {}
  mode: restart
