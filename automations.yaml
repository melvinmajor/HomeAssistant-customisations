- id: '1783347635674'
  alias: Entrance light - Door engine
  triggers:
  - entity_id: binary_sensor.myggbett_door_window_sensor_door
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: time
      after: sensor.sun_next_dawn
      before: sensor.sun_next_rising
    - condition: time
      after: sensor.sun_next_setting
      before: sensor.sun_next_dawn
  actions:
  - target:
      entity_id: light.accueil
    data:
      brightness_pct: "{% if is_state('input_boolean.cat_night_override', 'on') %}\n
        \ 20\n{% elif now().hour >= 23 or now().hour < 1 %}\n  20\n{% else %}\n  60\n{%
        endif %}\n"
    action: light.turn_on
  - wait_for_trigger:
    - entity_id: binary_sensor.myggbett_door_window_sensor_door
      from: 'on'
      to: 'off'
      trigger: state
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.cat_night_override
        state: 'on'
      sequence:
      - wait_template: "{{\n  is_state('binary_sensor.detecteur_entree_mouvement',
          'off')\n  and\n  is_state('binary_sensor.hue_motion_sensor_2_mouvement',
          'off')\n}}\n"
        timeout: 00:10:00
      - delay:
          hours: 0
          minutes: 0
          seconds: 30
          milliseconds: 0
      - condition: template
        value_template: "{{\n  is_state('binary_sensor.detecteur_entree_mouvement',
          'off')\n  and\n  is_state('binary_sensor.hue_motion_sensor_2_mouvement',
          'off')\n}}\n"
      - target:
          entity_id: light.accueil
        action: light.turn_off
  mode: restart
