- id: '1729426047896'
  alias: Entrance light motion at sunrise or sunset
  description: Unified sunrise/sunset motion automation
  triggers:
  - trigger: state
    entity_id: binary_sensor.detecteur_entree_mouvement
    to: 'on'
    id: chambre
  - trigger: state
    entity_id: binary_sensor.hue_motion_sensor_2_mouvement
    to: 'on'
    id: bureau
  conditions:
  - condition: or
    conditions:
    - condition: time
      after: sensor.sun_next_dawn
      before: sensor.sun_next_rising
    - condition: time
      after: sensor.sun_next_setting
      before: '23:00:00'
  - condition: state
    entity_id: input_boolean.entrance_light_override
    state: 'off'
  - condition: state
    entity_id: input_boolean.cat_night_override
    state: 'off'
  - condition: state
    entity_id: input_boolean.home
    state:
    - 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: chambre
      sequence:
      - if:
        - condition: and
          conditions:
          - condition: state
            entity_id: input_boolean.visitor_override
            state: 'off'
          - condition: numeric_state
            entity_id: sensor.myggspray_wrlss_mtn_sensor_illuminance
            above: 8
        then:
        - stop: 'SDB éclairée : pas besoin de lumière côté chambre'
        else:
        - action: light.turn_on
          target:
            entity_id: light.couloir_cote_chambre
          data:
            brightness_pct: 20
    - conditions:
      - condition: trigger
        id: bureau
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.couloir_cote_bureau
        data:
          brightness_pct: 20
  - wait_template: "{{\n  is_state('binary_sensor.detecteur_entree_mouvement', 'off')\n
      \ and\n  is_state('binary_sensor.hue_motion_sensor_2_mouvement', 'off')\n}}\n"
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.visitor_override
        state: 'on'
      sequence:
      - delay: 00:00:30
    default:
    - delay: 00:00:10
  - condition: template
    value_template: "{{\n  is_state('binary_sensor.detecteur_entree_mouvement', 'off')\n
      \ and\n  is_state('binary_sensor.hue_motion_sensor_2_mouvement', 'off')\n}}\n"
  - action: light.turn_off
    target:
      entity_id: light.accueil
  mode: restart
