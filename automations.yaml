- id: '1784037354172'
  alias: Echo Show 5 – Idle mode
  description: ''
  triggers:
  - entity_id:
    - event.vaca_dfc186925_gesture
    for:
      hours: 0
      minutes: 5
      seconds: 0
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ 7 <= now().hour < 22 }}'
  - condition: state
    entity_id: sensor.echo_show_5_2021
    state:
    - normal
    attribute: mode
  actions:
  - data:
      mode: night
    action: view_assist.set_state
    target:
      entity_id: sensor.echo_show_5_2021
  - target:
      entity_id: number.vaca_dfc186925_screen_brightness
    data:
      value: '1'
    action: number.set_value
  - target:
      entity_id: switch.vaca_dfc186925_auto_brightness
    action: switch.turn_off
- id: '1784037428175'
  alias: Echo Show 5 – Wake on Interaction
  description: ''
  triggers:
  - entity_id:
    - event.vaca_dfc186925_gesture
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ 7 <= now().hour < 22 }}'
  - condition: state
    entity_id: sensor.echo_show_5_2021
    state:
    - night
    attribute: mode
  actions:
  - data:
      mode: normal
    action: view_assist.set_state
    target:
      entity_id: sensor.echo_show_5_2021
  - target:
      entity_id: switch.vaca_dfc186925_auto_brightness
    action: switch.turn_on
  mode: single
- id: '1784038655563'
  alias: Echo Show 5 – Auto Night Mode
  description: ''
  triggers:
  - at: '22:00:00'
    trigger: time
  actions:
  - target:
      entity_id: sensor.echo_show_5_2021
    data:
      mode: night
      background: none
      background_offset_x: 0
      background_offset_y: 0
      screen_mode: hide_header_sidebar
      theme_overrides:
        primary_text_color: '#ff0000'
        secondary_text_color: '#ff0000'
        accent_color: '#ff0000'
        icon_color: '#ff0000'
        header_text_color: '#ff0000'
        card_text_color: '#ff0000'
    action: view_assist.set_state
  - target:
      entity_id: number.vaca_dfc186925_screen_brightness
    data:
      value: '1'
    action: number.set_value
  mode: single
- id: '1784038708465'
  alias: Echo Show 5 – Auto Day Mode
  description: ''
  triggers:
  - at: 07:00:00
    trigger: time
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (as_timestamp(now()) - as_timestamp(states(''sensor.view_assist_last_interaction'')))
          < 900 }}

          '
      sequence:
      - action: view_assist.set_state
        target:
          entity_id: sensor.echo_show_5_2021
        data:
          mode: normal
          background: /view_assist/dashboard/SurfaceDuo-NightSky.jpg
          background_offset_x: 0
          background_offset_y: 0
          screen_mode: normal
          theme_overrides: {}
      - target:
          entity_id: number.vaca_dfc186925_screen_brightness
        data:
          value: 50
        action: number.set_value
      - target:
          entity_id: switch.vaca_dfc186925_auto_brightness
        action: switch.turn_on
        data: {}
      alias: Recent interaction
    - conditions:
      - condition: template
        value_template: '{{ (as_timestamp(now()) - as_timestamp(states(''sensor.view_assist_last_interaction'')))
          >= 900 }}

          '
      sequence:
      - action: view_assist.set_state
        target:
          entity_id: sensor.echo_show_5_2021
        data:
          mode: night
          background: none
          background_offset_x: 0
          background_offset_y: 0
          screen_mode: hide_header_sidebar
      - target:
          entity_id: number.vaca_dfc186925_screen_brightness
        data:
          value: '1'
        action: number.set_value
      - target:
          entity_id: switch.vaca_dfc186925_auto_brightness
        action: switch.turn_off
        data: {}
      alias: No recent interaction
  mode: single
- id: '1785665277101'
  alias: Startup
  description: Actions to perform at startup for Home Assistant
  triggers:
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - data:
      name: Material You
    action: frontend.set_theme
    enabled: false
  - action: tts.clear_cache
    metadata: {}
    data: {}
  - if:
    - condition: state
      entity_id: input_select.heating_mode
      state:
      - Summer
    then:
    - action: automation.trigger
      metadata: {}
      target:
        entity_id: automation.heating_summer_mode
      data:
        skip_condition: true
    else:
    - action: automation.trigger
      metadata: {}
      target:
        entity_id: automation.heating_winter_mode_init
      data:
        skip_condition: true
    alias: Heating mode check
  - if:
    - condition: time
      after: 07:00:00
      before: '22:00:00'
    then:
    - action: automation.trigger
      metadata: {}
      target:
        entity_id: automation.echo_show_5_auto_day_mode
      data:
        skip_condition: true
    else:
    - action: automation.trigger
      metadata: {}
      target:
        entity_id: automation.echo_show_5_auto_night_mode
      data:
        skip_condition: true
    alias: Echo Show 5 day or night mode
  mode: single
