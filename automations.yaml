- id: '1786967025304'
  alias: Home - Presence status
  description: Sets home status on helper based on people presence
  triggers:
  - trigger: state
    entity_id:
    - person.melvin
    - person.yoline
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: person.melvin
          state: home
        - condition: state
          entity_id: person.yoline
          state: home
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.home
    default:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.home
  mode: single
