            - border-radius: 0px
          custom_fields:
            message:
              - position: absolute
              - width: 100%
              - align-self: middle
              - justify-self: center
        custom_fields:
          title: ""
          message:
            card:
              type: custom:layout-card
              layout_type: custom:masonry-layout
              layout:
                max_cols: 3
              cards: >-
                [[[ try {return
                hass.states[variables.var_assistsat_entity].attributes.intent_entities}
                catch { return ""}]]]
  - type: panel
    title: Music
    path: music
    cards:
      - type: custom:button-card
        variables:
          musiccardversion: 1.1.1
          var_musicplayer_device: |-
            [[[
              var assistbid = localStorage.getItem("view_assist_sensor");
              var musicdevice = hass.states[assistbid].attributes.musicplayer_device;
              return `${musicdevice}`
            ]]]   
        template:
          - variable_template
          - body_template
        styles:
          card:
            - background-color: black;
          custom_fields:
            message:
              - font-size: "[[[ return variables.var_font_size ]]]"
              - align-self: center
              - justify-self: center
              - width: 100%
              - height: 100%
              - position: absolute
              - justify-content: center
              - text-align: start
        custom_fields:
          title: "[[[ return variables.var_current_time ]]]"
          message:
            card:
              type: custom:mod-card
              card:
                type: media-control
                name: " "
                entity: "[[[ return variables.var_musicplayer_device ]]]"
              style: |
                ha-card {
                  width: 100vw !important;
                  height: 100vh !important;
                  margin: 0 !important;
                  padding: 0 !important;
                  box-shadow: none !important;
                  --paper-card-background-color: transparent !important;
                  --mdc-icon-size: 0px;
                }
  - type: panel
