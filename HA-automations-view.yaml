    icon: mdi:robot
    header:
      card:
        type: markdown
        content: '## Automations and key helpers'
        text_only: true
        card_mod:
          style: |
            ha-card {
              border-radius: 0px !important;
            }
    subview: false
    visible:
      - user: 44573b9ac3d34374a5e538fbac0b175d
      - user: 712f940e040f46d8ab27b65c0040f410
    badges:
      - type: custom:mushroom-template-badge
        entity: input_select.default_dashboard
        icon: mdi:view-dashboard
        content: '{{ states(entity) }}'
        label: '{{ state_attr(entity, ''friendly_name'') }}'
      - type: custom:mushroom-template-badge
        entity: automation.startup
        icon: mdi:home-assistant
        content: '{{ states(entity) | title }}'
        label: '{{ state_attr(entity, ''friendly_name'') }}'
        color: |
          {% if is_state(entity, 'on') %}
            green
          {% else %}
            red
          {% endif %}
      - type: custom:mushroom-template-badge
        entity: automation.set_ha_theme_at_startup
        icon: mdi:home-assistant
        content: '{{ states(entity) | title }}'
        label: '{{ state_attr(entity, ''friendly_name'') }}'
        color: |
          {% if is_state(entity, 'on') %}
            green
          {% else %}
            red
          {% endif %}
      - type: custom:mushroom-template-badge
        entity: automation.fanshim_ventilation
        icon: mdi:cpu-64-bit
        content: '{{ states(entity) | title }}'
        label: FanSHIM
        color: |
          {% if is_state(entity, 'on') %}
            green
          {% else %}
            red
          {% endif %}
    background:
      opacity: 50
      alignment: center
      size: cover
      repeat: no-repeat
      attachment: fixed
      image:
        media_content_id: >-
          media-source://media_source/local/backgrounds/microsoft-surface-dark-abstract-3840x2160.jpg
        media_content_type: image/jpeg
        metadata:
          title: microsoft-surface-dark-abstract-3840x2160.jpg
          thumbnail: null
          media_class: image
          children_media_class: null
          navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://media_source
            - media_content_type: ''
              media_content_id: media-source://media_source/local/backgrounds
