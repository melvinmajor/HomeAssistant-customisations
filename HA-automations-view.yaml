## Home Assistant view used as a secondary page to check configured automations.
# GitHub repo: <https://github.com/melvinmajor/HomeAssistant-customisations>
# Author: Melvin Campos Casares
# Last updated: 05/10/2026 (DD/MM/YYYY)

kiosk_mode:
  non_admin_settings:
    hide_add_to_home_assistant: true
    hide_search: true
decluttering_templates:
  home_navbar:
    card:
      type: custom:navbar-card
      routes:
        - url: /custom-dashboard/shortcuts
          icon: mdi:lifebuoy
          label: Shortcuts
          icon_color: '#9e9e9e'
        - url: /custom-dashboard/home
          icon: mdi:home
          label: Home
          icon_color: '#9e9e9e'
          hold_action:
            action: navigate
            navigation_path: /config/devices/dashboard
        - url: /custom-dashboard/kitchen
          icon: mdi:fridge
          label: Kitchen
          icon_color: '#9e9e9e'
        - url: /custom-dashboard/vehicle
          icon: phu:volvo
          label: Vehicle
          icon_color: '#9e9e9e'
        - icon: mdi:server-minus
          label: IT
          url: /custom-dashboard/IT-server
          icon_color: '#9e9e9e'
        - icon: mdi:dots-horizontal
          label: More
          icon_color: '#9e9e9e'
          tap_action:
            action: open-popup
          popup:
            - icon: mdi:cog
              url: /config/dashboard
              label: Configuration
              icon_color: white
            - icon: mdi:update
              url: /config/updates
              icon_color: white
              label: |
                [[[
                  const updates = parseInt(states['sensor.updates']?.state) || 0;
                  return updates > 0 ? `Updates (${updates} available)` : 'No updates';
                ]]]
            - url: /dashboard-automations
              icon: mdi:robot
              label: Automations
              icon_color: white
            - icon: mdi:home-battery
              label: Maintenance
              url: /custom-maintenance
              icon_color: white
            - url: /hacs/dashboard
              icon: phu:smarthome-solver
              label: HACS
              icon_color: white
            - icon: mdi:power
              icon_color: white
              tap_action:
                action: call-service
                service: homeassistant.restart
                service_data: {}
                confirmation:
                  text: Are you sure you want to restart Home Assistant?
              label: Restart HA
          badge:
            show: |
              [[[
                return (parseInt(states['sensor.updates']?.state) || 0) > 0;
              ]]]
      mobile:
        mode: floating
        show_popup_label_backgrounds: true
        show_labels: popup_only
        position: bottom
      desktop:
        show_labels: popup_only
        show_popup_label_backgrounds: true
        position: bottom
      media_player:
        album_cover_background: true
        players:
          - entity: media_player.google_tv
            title: Google TV
            icon: mdi:youtube-tv
            tap_action:
              action: more-info
              entity: media_player.google_tv_2
          - entity: media_player.google_nest_audio
            icon: phu:nest-audio
            tap_action:
              action: more-info
              entity: media_player.google_nest_audio
      layout:
        auto_padding:
          enabled: true
          desktop_px: 100
          mobile_px: 60
        reflect_child_state: true
      styles: |-
        .navbar.mobile.bottom {
          bottom: 5px;
        }
        .navbar-card {
          background: RGBA(0, 0, 0, 0.2) !important;
        }
      haptic:
        tap_action: true
  bubble_button:
    card:
      type: custom:bubble-card
      card_type: button
      button_type: '[[button_type]]'
      entity: '[[entity]]'
      name: '[[name]]'
      icon: '[[icon]]'
      show_icon: '[[show_icon]]'
      show_state: '[[show_state]]'
      show_attribute: '[[show_attribute]]'
      attribute: '[[attribute]]'
      double_tap_action:
        action: none
      hold_action:
        action: none
      button_action:
        double_tap_action:
          action: none
        hold_action:
          action: none
      sub_button:
        main: []
        bottom: []
      styles: |
        .bubble-button-card-container {
          background: rgba(from var(--md-sys-color-surface-container-high) r g b / 0.15) !important;
        }
