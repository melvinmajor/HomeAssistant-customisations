    header:
      card:
        type: markdown
        text_only: true
        content: '## Maintenance'
    max_columns: 3
    title: Maintenance
    icon: mdi:home-battery
    cards: []
    subview: false
    visible:
      - user: 44573b9ac3d34374a5e538fbac0b175d
      - user: 712f940e040f46d8ab27b65c0040f410
    background:
      opacity: 50
      alignment: center
      size: cover
      repeat: no-repeat
      attachment: fixed
      image:
        media_content_id: >-
          media-source://media_source/local/backgrounds/Black-Minimalist-Wallpaper-by-kensey-_WallpaperCave_.png
        media_content_type: image/png
        metadata:
          title: Black-Minimalist-Wallpaper-by-kensey-_WallpaperCave_.png
          thumbnail: null
          media_class: image
          children_media_class: null
          navigateIds:
            - {}
