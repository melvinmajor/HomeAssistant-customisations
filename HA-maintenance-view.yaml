## Home Assistant view used as a secondary page used for maintenance purpose.
# GitHub repo: <https://github.com/melvinmajor/HomeAssistant-customisations>
# Author: Melvin Campos Casares
# Last updated: 05/10/2026 (DD/MM/YYYY)

kiosk_mode:
  non_admin_settings:
    hide_add_to_home_assistant: true
    hide_search: true
decluttering_templates:
  home_navbar:
    card:
      type: custom:navbar-card
      routes:
        - url: /custom-dashboard/shortcuts
          icon: mdi:lifebuoy
          label: Shortcuts
          icon_color: '#9e9e9e'
        - url: /custom-dashboard/home
          icon: mdi:home
          label: Home
          icon_color: '#9e9e9e'
          hold_action:
            action: navigate
            navigation_path: /config/devices/dashboard
        - url: /custom-dashboard/kitchen
          icon: mdi:fridge
          label: Kitchen
          icon_color: '#9e9e9e'
        - url: /custom-dashboard/vehicle
          icon: phu:volvo
          label: Vehicle
          icon_color: '#9e9e9e'
        - icon: mdi:server-minus
          label: IT
          url: /custom-dashboard/IT-server
          icon_color: '#9e9e9e'
        - icon: mdi:dots-horizontal
          label: More
          icon_color: '#9e9e9e'
          tap_action:
            action: open-popup
          popup:
            - icon: mdi:cog
              url: /config/dashboard
              label: Configuration
              icon_color: white
            - icon: mdi:update
              url: /config/updates
              icon_color: white
              label: |
                [[[
                  const updates = parseInt(states['sensor.updates']?.state) || 0;
                  return updates > 0 ? `Updates (${updates} available)` : 'No updates';
                ]]]
            - url: /dashboard-automations
              icon: mdi:robot
              label: Automations
              icon_color: white
            - icon: mdi:home-battery
              label: Maintenance
              url: /custom-maintenance
              icon_color: white
            - url: /hacs/dashboard
              icon: phu:smarthome-solver
              label: HACS
              icon_color: white
            - icon: mdi:power
              icon_color: white
              tap_action:
                action: call-service
                service: homeassistant.restart
                service_data: {}
                confirmation:
                  text: Are you sure you want to restart Home Assistant?
              label: Restart HA
          badge:
            show: |
              [[[
                return (parseInt(states['sensor.updates']?.state) || 0) > 0;
              ]]]
      mobile:
        mode: floating
        show_popup_label_backgrounds: true
        show_labels: popup_only
        position: bottom
      desktop:
        show_labels: popup_only
        show_popup_label_backgrounds: true
        position: bottom
      media_player:
        album_cover_background: true
        players:
          - entity: media_player.google_tv
            title: Google TV
            icon: mdi:youtube-tv
            tap_action:
              action: more-info
              entity: media_player.google_tv_2
          - entity: media_player.google_nest_audio
            icon: phu:nest-audio
            tap_action:
              action: more-info
              entity: media_player.google_nest_audio
      layout:
        auto_padding:
          enabled: true
          desktop_px: 100
          mobile_px: 60
        reflect_child_state: true
      styles: |-
        .navbar.mobile.bottom {
          bottom: 5px;
        }
        .navbar-card {
          background: RGBA(0, 0, 0, 0.2) !important;
        }
      haptic:
        tap_action: true
views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: custom:m3-battery-card
            auto_discover: false
            glass_background: true
            max_visible: 4
            include_area: []
            include_label: []
            exclude_entities: []
            entities:
              - entity: sensor.radiator_thermostat_w600_battery
                name: Entrance
              - entity: sensor.radiator_thermostat_w600_battery_3
                name: Bathroom
              - entity: sensor.radiator_thermostat_w600_battery_2
                name: Office
              - entity: sensor.radiator_thermostat_w600_battery_4
                name: Bedroom
            thresholds:
              critical: 10
              low: 20
              medium: 30
            card_version: 2.2.0
            name: Radiator thermostats (using 2x AA)
            show_healthy_toggle: true
            icon: phu:aqara-thermo-e1
          - type: custom:m3-battery-card
            auto_discover: false
            glass_background: true
            max_visible: 3
            include_area: []
            include_label: []
            exclude_entities: []
            entities:
              - entity: sensor.detecteur_entree_batterie
                name: Entrance (bedroom side)
                icon: phu:motion-sensor
              - entity: sensor.hue_motion_sensor_2_batterie
                name: Entrance (office side)
                icon: phu:motion-sensor
              - entity: sensor.myggspray_wrlss_mtn_sensor_battery
                name: Bathroom
                icon: phu:outdoor-motion
            thresholds:
              critical: 10
              low: 20
              medium: 30
            card_version: 2.2.0
            name: Motion sensors (using 2x AAA)
            show_healthy_toggle: true
            icon: mdi:motion-sensor
      - type: grid
        cards:
          - type: custom:m3-battery-card
            auto_discover: false
            glass_background: true
            max_visible: 5
            include_area: []
            include_label: []
            exclude_entities: []
            entities:
              - entity: sensor.hue_smart_button_1_batterie
                name: Entrance
                icon: phu:button
              - entity: sensor.hue_smart_button_3_batterie
                name: Living room
                icon: phu:button
              - entity: sensor.hue_smart_button_2_batterie
                name: Office
