          - condition: state
            entity: input_boolean.dev_mode
            state: 'on'
      - type: grid
        cards:
          - type: heading
            heading: Philips Hue Smart Buttons
            heading_style: title
            icon: phu:button
          - type: markdown
            content: '**Battery type:** CR2032'
            text_only: true
          - type: tile
            entity: sensor.hue_smart_button_1_batterie
            name: Entrance
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.hue_smart_button_3_batterie
            name: Living room
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.hue_smart_button_2_batterie
            name: Office
            vertical: false
            features_position: bottom
          - type: heading
            heading: Philips Hue switches
            heading_style: title
            icon: phu:hue-only
          - type: markdown
            content: '**Battery type:** CR2032'
            text_only: true
          - type: vertical-stack
            cards:
              - type: heading
                heading: Hue Tap Dial
                heading_style: title
                icon: phu:tap-dial
                grid_options:
                  columns: 6
                  rows: auto
              - type: tile
                grid_options:
                  columns: 6
                  rows: 1
                entity: sensor.hue_tap_dial_switch_1_batterie
